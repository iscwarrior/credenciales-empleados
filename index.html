
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credencial de empleado | OpenNet</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef2f5;
      color: #263238;
    }

    .contenedor {
      max-width: 450px;
      margin: 20px auto;
    }

    .credencial {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px #0002;
    }

    .encabezado {
      background: #123b5d;
      color: white;
      text-align: center;
      padding: 24px 15px;
    }

    .encabezado h1 {
      margin: 0;
      font-size: 25px;
    }

    .encabezado p {
      margin: 8px 0 0;
      font-size: 13px;
    }

    .contenido {
      padding: 22px;
    }

    .nombre {
      text-align: center;
      font-size: 23px;
      font-weight: bold;
      color: #123b5d;
      margin-bottom: 8px;
    }

    .cargo-principal {
      text-align: center;
      margin-bottom: 24px;
      color: #526575;
    }

    .dato {
      padding: 12px 0;
      border-bottom: 1px solid #e6eaed;
    }

    .etiqueta {
      display: block;
      font-size: 12px;
      color: #667782;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .valor {
      font-size: 16px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .estado {
      margin-top: 20px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .vigente {
      background: #e2f6e9;
      color: #18753b;
    }

    .vencida {
      background: #fde8e7;
      color: #a3231b;
    }

    .error {
      background: white;
      color: #a3231b;
      border-radius: 12px;
      padding: 20px;
      overflow-wrap: anywhere;
    }

    .pie {
      text-align: center;
      font-size: 12px;
      color: #71808a;
      padding: 16px;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <section class="credencial" id="credencial">

      <header class="encabezado">
        <h1>OpenNet</h1>
        <p>Ingeniería e Infraestructura</p>
        <p>Credencial de identificación de empleado</p>
      </header>

      <div class="contenido">
        <div class="nombre" id="nombre">Cargando...</div>
        <div class="cargo-principal" id="cargo">Cargando...</div>

        <div class="dato">
          <span class="etiqueta">Número de empleado</span>
          <span class="valor" id="numero-empleado">Cargando...</span>
        </div>

        <div class="dato">
          <span class="etiqueta">Empresa</span>
          <span class="valor" id="nombre-empresa">Cargando...</span>
        </div>

        <div class="dato">
          <span class="etiqueta">Cargo</span>
          <span class="valor" id="cargo">Cargando...</span>
        </div>

        <div class="dato">
          <span class="etiqueta">Cargo</span>
          <span class="valor" id="cargo-detalle">Cargando...</span>
        </div>

        <div class="dato">
          <span class="etiqueta">Fecha de expedición</span>
          <span class="valor" id="expedicion">Cargando...</span>
        </div>

        <div class="dato">
          <span class="etiqueta">Vigencia hasta</span>
          <span class="valor" id="vigencia">Cargando...</span>
        </div>

        <div id="estado" class="estado oculto"></div>
      </div>

      <footer class="pie">
        Documento de identificación laboral
      </footer>
    </section>

    <div id="mensaje-error" class="error oculto"></div>
  </main>

  <script>
    "use strict";

    function mostrarError(mensaje) {
      document.getElementById("credencial").classList.add("oculto");

      const error = document.getElementById("mensaje-error");
      error.textContent = mensaje;
      error.classList.remove("oculto");
    }

    function setText(id, value) {
      const elemento = document.getElementById(id);

      if (!elemento) {
        throw new Error(
          `No existe un elemento HTML con id="${id}".`
        );
      }

      elemento.textContent =
        value == null || value === ""
          ? "No especificado"
          : String(value);
    }

    function formatearFecha(fecha) {
      if (!fecha) {
        return "No especificada";
      }

      const partes = String(fecha).split("-");

      if (
        partes.length !== 3 ||
        !/^\d{4}-\d{2}-\d{2}$/.test(String(fecha))
      ) {
        return fecha;
      }

      const [anio, mes, dia] = partes;
      const fechaUTC = new Date(
        Date.UTC(Number(anio), Number(mes) - 1, Number(dia))
      );

      if (
        fechaUTC.getUTCFullYear() !== Number(anio) ||
        fechaUTC.getUTCMonth() !== Number(mes) - 1 ||
        fechaUTC.getUTCDate() !== Number(dia)
      ) {
        return fecha;
      }

      return `${dia}/${mes}/${anio}`;
    }

    function actualizarVigencia(fecha) {
      const elemento = document.getElementById("estado");

      elemento.classList.remove("oculto", "vigente", "vencida");

      if (!fecha || !/^\d{4}-\d{2}-\d{2}$/.test(fecha)) {
        elemento.textContent = "No se pudo verificar la vigencia";
        elemento.classList.add("vencida");
        return;
      }

      const [anio, mes, dia] = fecha.split("-").map(Number);
      const vencimiento = new Date(
        Date.UTC(anio, mes - 1, dia)
      );

      if (
        vencimiento.getUTCFullYear() !== anio ||
        vencimiento.getUTCMonth() !== mes - 1 ||
        vencimiento.getUTCDate() !== dia
      ) {
        elemento.textContent = "Fecha de vigencia inválida";
        elemento.classList.add("vencida");
        return;
      }

      const hoy = new Date();
      const hoyUTC = Date.UTC(
        hoy.getFullYear(),
        hoy.getMonth(),
        hoy.getDate()
      );

      if (vencimiento.getTime() >= hoyUTC) {
        elemento.textContent = "Credencial vigente";
        elemento.classList.add("vigente");
      } else {
        elemento.textContent = "Credencial vencida";
        elemento.classList.add("vencida");
      }
    }

    async function cargarEmpleado() {
      const parametros = new URLSearchParams(window.location.search);
      const id = parametros.get("id");

      if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) {
        mostrarError(
          "No se especificó un empleado válido en la dirección del sitio."
        );
        return;
      }

      const url = `./empleados/${encodeURIComponent(id)}.json`;

      try {
        const respuesta = await fetch(url);

        if (!respuesta.ok) {
          throw new Error(
            `No se encontró el archivo del empleado. Código HTTP: ${respuesta.status}`
          );
        }

        const data = await respuesta.json();

        setText("nombre", data.nombre);
        setText("numero-empleado", data.numero_empleado);
        setText("nombre-empresa", data.nombre_empresa);
        setText("numero-empresa", data.numero_empresa);
        setText("cargo", data.cargo);
        setText("cargo-detalle", data.cargo);
        setText("expedicion", formatearFecha(data.expedicion));
        setText("vigencia", formatearFecha(data.vigencia));

        actualizarVigencia(data.vigencia);

      } catch (error) {
        console.error("Error al cargar la credencial:", error);
        mostrarError(
          "No fue posible cargar la credencial. Verifica que el archivo JSON exista, que sus datos sean correctos y que esté publicado en GitHub Pages. Detalle: " +
          error.message
        );
      }
    }

    cargarEmpleado();
  </script>
</body>
</html>
